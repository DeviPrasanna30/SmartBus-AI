<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartBus AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:white;
    padding:22px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e5eaf1;
}

.logo{
    font-size:28px;
    font-weight:800;
    color:#1769e0;
}

.tagline{
    color:#6b7890;
    margin-top:5px;
    font-size:13px;
}

.badge{
    background:#eaf3ff;
    color:#1769e0;
    padding:9px 15px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.hero{
    text-align:center;
    padding:45px 20px 25px;
}

.hero h1{
    font-size:38px;
}

.hero h1 span{
    color:#1769e0;
}

.hero p{
    margin-top:10px;
    color:#637189;
}

.container{
    width:86%;
    max-width:1060px;
    margin:auto;
}

.search-card{
    background:white;
    padding:28px;
    border-radius:18px;
    box-shadow:0 7px 25px rgba(25,45,70,.08);
}

.search-title{
    font-size:22px;
    font-weight:800;
}

.search-sub{
    margin-top:6px;
    color:#718096;
    font-size:13px;
}

.form{
    display:grid;
    grid-template-columns:1fr 50px 1fr 145px;
    gap:12px;
    margin-top:22px;
}

label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:#53627a;
    margin-bottom:7px;
}

select{
    width:100%;
    height:50px;
    border:1px solid #d7dee8;
    border-radius:11px;
    padding:0 14px;
    background:white;
    font-size:14px;
    color:#172033;
}

.swap{
    height:50px;
    margin-top:18px;
    border:1px solid #d7dee8;
    background:white;
    border-radius:11px;
    cursor:pointer;
    font-size:20px;
}

.search-btn{
    height:50px;
    margin-top:18px;
    border:none;
    border-radius:11px;
    background:#1769e0;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.search-btn:hover{
    background:#125bc4;
}

.popular{
    margin:30px 0 22px;
}

.popular h3{
    font-size:17px;
    margin-bottom:12px;
}

.route-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.route-btn{
    background:white;
    border:1px solid #dce3ec;
    border-radius:20px;
    padding:9px 14px;
    cursor:pointer;
    color:#245080;
}

.results-title{
    font-size:22px;
    margin:25px 0 5px;
}

.results-sub{
    color:#718096;
    font-size:13px;
    margin-bottom:15px;
}

.bus-card{
    background:white;
    border-radius:17px;
    padding:22px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(25,45,70,.07);
}

.bus-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.bus-number{
    font-size:24px;
    font-weight:800;
    color:#1769e0;
}

.bus-type{
    display:inline-block;
    margin-left:8px;
    background:#edf4ff;
    color:#1769e0;
    padding:5px 9px;
    border-radius:7px;
    font-size:10px;
    font-weight:700;
}

.bus-route{
    margin-top:8px;
    font-weight:700;
    font-size:16px;
}

.eta-box{
    text-align:right;
}

.eta-label{
    color:#718096;
    font-size:11px;
}

.eta{
    font-size:18px;
    font-weight:800;
    margin-top:3px;
}

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:18px;
}

.detail{
    background:#f7f9fc;
    padding:13px;
    border-radius:10px;
}

.detail-label{
    color:#718096;
    font-size:11px;
}

.detail-value{
    font-size:16px;
    font-weight:800;
    margin-top:5px;
}

.stops{
    margin-top:16px;
    padding:14px;
    background:#f8fafc;
    border-radius:11px;
}

.stops-title{
    font-size:12px;
    font-weight:800;
    margin-bottom:9px;
}

.stop-list{
    color:#53627a;
    font-size:12px;
    line-height:1.8;
}

.track-btn{
    margin-top:15px;
    width:100%;
    height:44px;
    border:none;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.no-results{
    background:white;
    border:1px solid #e0e6ee;
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:#718096;
}

footer{
    margin-top:55px;
    background:#172033;
    color:white;
    text-align:center;
    padding:25px;
    font-size:12px;
}

@media(max-width:800px){

    .form{
        grid-template-columns:1fr;
    }

    .swap,
    .search-btn{
        margin-top:0;
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .bus-top{
        flex-direction:column;
        gap:12px;
    }

    .eta-box{
        text-align:left;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <div class="logo">SmartBus AI</div>
        <div class="tagline">Know Before You Board</div>
    </div>

    <div class="badge">LIVE BUS SYSTEM</div>
</header>

<section class="hero">
    <h1>SmartBus <span>AI</span></h1>
    <p>Find buses, check occupancy and track your journey live.</p>
</section>

<div class="container">

    <section class="search-card">

        <div class="search-title">Where are you going?</div>

        <div class="search-sub">
            Select your starting station and destination.
        </div>

        <div class="form">

            <div>
                <label>FROM</label>
                <select id="fromStation"></select>
            </div>

            <button class="swap" onclick="swapStations()">⇄</button>

            <div>
                <label>TO</label>
                <select id="toStation"></select>
            </div>

            <button class="search-btn" onclick="searchBuses()">
                🔎 Search Buses
            </button>

        </div>

    </section>


    <section class="popular">

        <h3>Popular Routes</h3>

        <div class="route-buttons">

            <button class="route-btn"
                onclick="setRoute('Kakinada Complex','Rajahmundry Complex')">
                Kakinada → Rajahmundry
            </button>

            <button class="route-btn"
                onclick="setRoute('Kakinada Complex','Surampalem Complex')">
                Kakinada → Surampalem
            </button>

            <button class="route-btn"
                onclick="setRoute('Kakinada Complex','Amalapuram')">
                Kakinada → Amalapuram
            </button>

            <button class="route-btn"
                onclick="setRoute('Rajahmundry Complex','Kakinada Complex')">
                Rajahmundry → Kakinada
            </button>

            <button class="route-btn"
                onclick="setRoute('Surampalem Complex','Kakinada Complex')">
                Surampalem → Kakinada
            </button>

            <button class="route-btn"
                onclick="setRoute('Amalapuram','Kakinada Complex')">
                Amalapuram → Kakinada
            </button>

        </div>

    </section>


    <section>

        <h2 class="results-title" id="resultsTitle">
            Search for a bus
        </h2>

        <div class="results-sub" id="resultsSub">
            Choose your From and To stations.
        </div>

        <div id="busResults"></div>

    </section>

</div>


<footer>
    SmartBus AI • Know Before You Board
</footer>


<script src="script.js"></script>

</body>
</html>
